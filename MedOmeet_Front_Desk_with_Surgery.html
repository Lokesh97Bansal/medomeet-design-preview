<!doctype html><html lang="en"><head>
<meta name="robots" content="noindex,nofollow"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MedOmeet Front Desk with surgery</title><style>
:root{--g:#17784F;--gd:#125e3e;--gt:#e7f3ed;--tx:#16232e;--t2:#4a5a66;--ln:#dfe6ec;--bg:#eef2f5;--card:#fff}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;font-family:'Plus Jakarta Sans',system-ui,'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--tx);font-size:15px}
button{font-family:inherit;font-size:15px;cursor:pointer}
.top{height:64px;background:var(--card);border-bottom:1px solid var(--ln);display:flex;align-items:center;gap:10px;padding:0 16px;position:fixed;top:0;left:0;right:0;z-index:10}
.top h1{font-size:17px;margin:0 8px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.b{height:44px;padding:0 16px;border-radius:12px;border:1px solid #7d8b97;background:var(--card);color:var(--tx);font-weight:700;white-space:nowrap}
.b:hover{border-color:var(--g);color:var(--g)}.b.p{background:var(--g);border-color:var(--g);color:#fff}.b.p:hover{background:var(--gd)}
.b:disabled{opacity:.45;cursor:default}.b:focus-visible,.it:focus-visible,input:focus-visible{outline:3px solid #8fd1b0;outline-offset:1px}
.side{position:fixed;top:64px;bottom:0;left:0;width:340px;background:var(--card);border-right:1px solid var(--ln);display:flex;flex-direction:column;z-index:9}
.side .f{padding:12px;border-bottom:1px solid var(--ln)}.side input{width:100%;height:44px;border:1px solid #7d8b97;border-radius:12px;padding:0 12px;font-size:15px;font-family:inherit}
.list{overflow:auto;flex:1;padding:4px 0 40px}
.pg{font-size:14px;font-weight:800;color:var(--g);text-transform:uppercase;letter-spacing:.03em;padding:18px 16px 6px;position:sticky;top:0;background:var(--card)}
.rw{font-size:14px;font-weight:700;color:var(--t2);padding:12px 16px 4px;line-height:1.35}
.it{display:block;width:100%;text-align:left;border:0;background:none;padding:9px 16px 9px 26px;font-size:14px;line-height:1.35;color:var(--tx);border-left:4px solid transparent}
.it:hover{background:var(--bg)}.it.on{background:var(--gt);border-left-color:var(--g);font-weight:700}
.main{position:fixed;top:64px;bottom:0;left:340px;right:0;overflow:auto;padding:16px 20px 60px}
.cap{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 12px}.cap .t{font-size:17px;font-weight:800}.cap .w{font-size:14px;color:var(--t2)}
.wrap{transform-origin:0 0;position:relative}.fr{border:1px solid var(--ln);border-radius:12px;background:#fff;display:block}
.home{max-width:980px}.home h2{font-size:24px;margin:8px 0 6px}.home p{color:var(--t2);margin:0 0 18px;line-height:1.5;max-width:760px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.go{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:16px;text-align:left;min-height:88px;display:flex;flex-direction:column;gap:6px}
.go:hover{border-color:var(--g)}.go b{font-size:16px}.go span{font-size:14px;color:var(--t2)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--tx);color:#fff;padding:12px 18px;border-radius:12px;font-size:15px;display:none;z-index:20}
.menu{display:none}.nav2{display:flex;gap:10px;justify-content:flex-end;margin-top:14px}.nav2 .b{height:48px}
@media (max-width:860px){.side{width:100%;display:none}.side.open{display:flex}.main{left:0;padding:12px 16px 60px}.menu{display:inline-block}.hide-s{display:none}}
</style></head><body>
<div class="top"><button class="b menu" id="mn">Screen list</button><h1>Front desk screens with planned surgery inside</h1>
